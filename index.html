<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Csariel's · Sistema Solar – Zoom Realista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* ==============================================================
   VARIABLES DE COLOR Y FUENTE
   ============================================================== */
:root{
  --bg-space:#010205;
  --text-primary:#e8f0fe;
  --text-muted:#7a8aaa;
  --gold:#ffd700;
}

/* ==============================================================
   RESET + BODY
   ============================================================== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg-space);
  overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--text-primary);
}

/* ==============================================================
   FONDO ESTELAR
   ============================================================== */
.stars{
  position:fixed; inset:0;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 60%),
            radial-gradient(circle at 78% 70%,rgba(255,255,255,.06),transparent 70%),
            radial-gradient(circle at 45% 15%,rgba(255,255,255,.04),transparent 50%);
  background-size:400px 400px;
  opacity:.25;
  animation:twinkle 8s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.15}50%{opacity:.35}100%{opacity:.2}}

/* ==============================================================
   CONTENEDOR PRINCIPAL + ZOOM
   ============================================================== */
#viewport{
  position:relative;
  width:100vw; height:100vh;
  overflow:hidden;
  cursor:grab;
}
#solar{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;
  transition:transform .1s ease-out;
}

/* ==============================================================
   SOL
   ============================================================== */
.sun{
  position:absolute;
  width:180px;height:180px;
  top:50%; left:50%;
  margin:-90px 0 0 -90px;
  border-radius:50%;
  background:url('https://www.solarsystemscope.com/textures/download/2k_sun.jpg') center/cover;
  box-shadow:0 0 120px rgba(255,215,0,.4),0 0 300px rgba(255,140,0,.2);
}

/* ==============================================================
   ORBITAS
   ============================================================== */
.orbit{
  position:absolute;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
}

/* ==============================================================
   PLANETAS (textura de alta resolución)
   ============================================================== */
.planet{
  position:absolute;
  border-radius:50%;
  cursor:pointer;
  transform-origin:center;
  transition:transform .3s;
}
.planet:hover{transform:scale(1.4);z-index:5;}

/* ----- Mercurio ----- */
.mercury{
  width:10px;height:10px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_mercury.jpg') center/cover;
  animation:orbitM 4s linear infinite;
}
@keyframes orbitM{
  from{transform:rotate(0deg) translateX(55px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(55px) rotate(-360deg);}
}

/* ----- Venus ----- */
.venus{
  width:18px;height:18px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_venus_atmosphere.jpg') center/cover;
  animation:orbitV 7s linear infinite;
}
@keyframes orbitV{
  from{transform:rotate(0deg) translateX(85px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(85px) rotate(-360deg);}
}

/* ----- Tierra ----- */
.earth{
  width:20px;height:20px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg') center/cover;
  animation:orbitE 10s linear infinite;
}
@keyframes orbitE{
  from{transform:rotate(0deg) translateX(115px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(115px) rotate(-360deg);}
}

/* ----- Luna (opcional) ----- */
.moon{
  width:6px;height:6px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_moon.jpg') center/cover;
  animation:orbitMoon 2s linear infinite;
}
@keyframes orbitMoon{
  from{transform:rotate(0deg) translateX(30px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(30px) rotate(-360deg);}
}

/* ----- Marte ----- */
.mars{
  width:16px;height:16px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_mars.jpg') center/cover;
  animation:orbitMa 15s linear infinite;
}
@keyframes orbitMa{
  from{transform:rotate(0deg) translateX(150px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(150px) rotate(-360deg);}
}

/* ----- Júpiter ----- */
.jupiter{
  width:36px;height:36px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg') center/cover;
  animation:orbitJu 20s linear infinite;
}
@keyframes orbitJu{
  from{transform:rotate(0deg) translateX(200px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(200px) rotate(-360deg);}
}

/* ----- Saturno ----- */
.saturn{
  width:34px;height:34px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_saturn.jpg') center/cover;
  animation:orbitSa 30s linear infinite;
}
@keyframes orbitSa{
  from{transform:rotate(0deg) translateX(260px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(260px) rotate(-360deg);}
}
/* Anillo de Saturno */
.saturn::before{
  content:'';
  position:absolute;
  inset:-8px;
  border:3px solid rgba(255,215,0,.4);
  border-radius:50%;
  transform:rotateX(55deg);
}

/* ----- Urano ----- */
.uranus{
  width:28px;height:28px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_uranus.jpg') center/cover;
  animation:orbitU 35s linear infinite;
}
@keyframes orbitU{
  from{transform:rotate(0deg) translateX(310px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(310px) rotate(-360deg);}
}

/* ----- Neptuno ----- */
.neptune{
  width:26px;height:26px;
  background:url('https://www.solarsystemscope.com/textures/download/2k_neptune.jpg') center/cover;
  animation:orbitN 45s linear infinite;
}
@keyframes orbitN{
  from{transform:rotate(0deg) translateX(360px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(360px) rotate(-360deg);}
}

/* ==============================================================
   TOOLTIP (información rápida)
   ============================================================== */
.tooltip{
  position:absolute;
  padding:.4rem .6rem;
  background:rgba(0,0,0,.7);
  border-radius:4px;
  font-size:.75rem;
  pointer-events:none;
  opacity:0;
  transition:opacity .2s;
}

/* ==============================================================
   CONTROLES DE ZOOM
   ============================================================== */
#controls{
  position:fixed;
  top:1rem; right:1rem;
  display:flex; flex-direction:column; gap:.5rem;
  z-index:10;
}
#controls button{
  background:rgba(255,255,255,.1);
  border:none; color:#fff;
  padding:.5rem .8rem;
  font-size:1rem; cursor:pointer;
  border-radius:4px;
}
#controls button:hover{background:rgba(255,255,255,.3);}
  </style>
</head>
<body>

<div class="stars"></div>

<div id="viewport">
  <div id="solar">

    <!-- Sol -->
    <div class="sun"></div>

    <!-- Órbitas (solo para referencia visual) -->
    <div class="orbit" style="width:110px;height:110px;"></div><!-- Mercurio -->
    <div class="orbit" style="width:170px;height:170px;"></div><!-- Venus -->
    <div class="orbit" style="width:230px;height:230px;"></div><!-- Tierra -->
    <div class="orbit" style="width:300px;height:300px;"></div><!-- Marte -->
    <div class="orbit" style="width:400px;height:400px;"></div><!-- Júpiter -->
    <div class="orbit" style="width:520px;height:520px;"></div><!-- Saturno -->
    <div class="orbit" style="width:620px;height:620px;"></div><!-- Urano -->
    <div class="orbit" style="width:720px;height:720px;"></div><!-- Neptuno -->

    <!-- Planetas -->
    <div class="planet mercury"></div>
    <div class="planet venus"></div>

    <div class="planet earth">
      <div class="planet moon"></div>
    </div>

    <div class="planet mars"></div>
    <div class="planet jupiter"></div>
    <div class="planet saturn"></div>
    <div class="planet uranus"></div>
    <div class="planet neptune"></div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>
  </div>
</div>

<!-- Controles de zoom -->
<div id="controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">‑</button>
</div>

<script>
/* ==================== ZOOM & PAN ==================== */
const viewport = document.getElementById('viewport');
const solar = document.getElementById('solar');
let scale = 1;
const minScale = 0.4;
const maxScale = 4;

function setScale(s){
  scale = Math.min(maxScale, Math.max(minScale, s));
  solar.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
document.getElementById('zoomIn').onclick = () => setScale(scale*1.2);
document.getElementById('zoomOut').onclick = () => setScale(scale/1.2);

// rueda del ratón
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.15 : 0.85;
  const rect = solar.getBoundingClientRect();
  // mantener el punto bajo el cursor centrado
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const nx = cx / scale;
  const ny = cy / scale;
  setScale(scale*delta);
  // corrige tras el scale
  solar.style.left = `calc(50% - ${nx*scale}px)`;
  solar.style.top  = `calc(50% - ${ny*scale}px)`;
});

/* =============== DRAG TO PAN =============== */
let isPanning = false;
let startX, startY, startLeft, startTop;
viewport.addEventListener('mousedown', e=>{
  isPanning = true;
  viewport.style.cursor = 'grabbing';
  startX = e.clientX;
  startY = e.clientY;
  const style = getComputedStyle(solar);
  startLeft = parseFloat(style.left);
  startTop  = parseFloat(style.top);
});
window.addEventListener('mousemove', e=>{
  if(!isPanning) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  solar.style.left = `${startLeft + dx}px`;
  solar.style.top  = `${startTop  + dy}px`;
});
window.addEventListener('mouseup', ()=>{isPanning=false; viewport.style.cursor='grab';});

/* ==================== TOOLTIP ==================== */
const tooltip = document.getElementById('tooltip');
const planetInfo = {
  mercury:{name:'Mercurio', detalle:'~4 800 km de diámetro, 0.39 UA del Sol.'},
  venus:{name:'Venus', detalle:'~12 100 km, atmósfera densa, 0.72 UA.'},
  earth:{name:'Tierra', detalle:'~12 742 km, 1 UA, vida tal como la conocemos.'},
  moon:{name:'Luna', detalle:'~3 474 km, 0.0026 UA de la Tierra.'},
  mars:{name:'Marte', detalle:'~6 779 km, 1.52 UA.'},
  jupiter:{name:'Júpiter', detalle:'~139 820 km, 5.2 UA, mayor planeta.'},
  saturn:{name:'Saturno', detalle:'~116 460 km, 9.5 UA, anillos icónicos.'},
  uranus:{name:'Urano', detalle:'~50 724 km, 19.2 UA, plano inclinado.'},
  neptune:{name:'Neptuno', detalle:'~49 244 km, 30.1 UA, viento supersonico.'}
};

document.querySelectorAll('.planet').forEach(p=>{
  p.addEventListener('mouseenter', e=>{
    const id = e.target.classList[1]; // segunda clase = nombre en nuestro CSS
    const info = planetInfo[id];
    if(info){
      tooltip.textContent = `${info.name} – ${info.detalle}`;
      tooltip.style.opacity = 1;
    }
  });
  p.addEventListener('mousemove', e=>{
    tooltip.style.left = e.clientX + 12 + 'px';
    tooltip.style.top  = e.clientY + 12 + 'px';
  });
  p.addEventListener('mouseleave',()=>{tooltip.style.opacity=0;});
});
</script>

</body>
</html>
