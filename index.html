<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Csariel's · Sistema Solar – Supernova + Vía Láctea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* -------------------------------------------------
       VARIABLES DE COLOR
    ------------------------------------------------- */
    :root{
      --bg-space:#010205;
      --text-primary:#e8f0fe;
      --gold:#ffd700;
    }

    /* -------------------------------------------------
       RESET + BODY
    ------------------------------------------------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg-space);
      overflow:hidden;
      font-family:'Inter',system-ui,sans-serif;
      color:var(--text-primary);
    }

    /* -------------------------------------------------
       ESTRELLAS DE FONDO (más estrellas)
    ------------------------------------------------- */
    .stars{
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 60%),
        radial-gradient(circle at 78% 70%,rgba(255,255,255,.06),transparent 70%),
        radial-gradient(circle at 45% 15%,rgba(255,255,255,.04),transparent 50%),
        radial-gradient(circle at 10% 80%,rgba(255,255,255,.07),transparent 55%),
        radial-gradient(circle at 90% 20%,rgba(255,255,255,.05),transparent 60%);
      background-size:400px 400px;
      opacity:.35;
      animation:twinkle 8s ease-in-out infinite alternate;
    }
    .stars::after{
      content:'';
      position:absolute; inset:0;
      background:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%222%22 height=%222%22><circle cx=%221%22 cy=%221%22 r=%220.6%22 fill=%22white%22 opacity=%220.9%22/></svg>');
      background-size:2px 2px;
      animation:starfield 40s linear infinite;
    }
    @keyframes twinkle{0%{opacity:.18}50%{opacity:.38}100%{opacity:.22}}
    @keyframes starfield{
      from{transform:translateX(0) translateY(0);}
      to{transform:translateX(-2000px) translateY(-2000px);}
    }

    /* -------------------------------------------------
       GALAXIA (Vía Láctea + Agujero Negro + Supernova)
    ------------------------------------------------- */
    .galaxy{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .milky-way{
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at bottom,
        rgba(255,255,255,.15), transparent 70%);
      transform:rotate(135deg) scale(1.3);
      filter:blur(2px);
      animation:galaxyPulsate 30s ease-in-out infinite;
    }
    @keyframes galaxyPulsate{
      0%,100%{opacity:.8}
      50%{opacity:.6}
    }
    .black-hole{
      position:absolute;
      top:50%; left:50%;
      width:30px; height:30px;
      margin:-15px 0 0 -15px;
      border-radius:50%;
      background:radial-gradient(circle,#111 0%,#000 70%);
      box-shadow:
        0 0 30px 15px rgba(0,0,0,.9),
        0 0 60px 30px rgba(0,0,0,.7),
        0 0 120px 60px rgba(0,0,0,.5);
      animation:spinBH 12s linear infinite;
    }
    @keyframes spinBH{to{transform:rotate(360deg)}}

    /* ---- SUPERNOVA ---- */
    .supernova{
      position:absolute;
      top:50%; left:50%;
      width:0; height:0;
      margin:-0 0 0 0;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,200,0,.9),transparent 70%);
      opacity:0;
      pointer-events:none;
    }
    .supernova.active{
      animation:explode 2s forwards;
    }
    @keyframes explode{
      0%{
        width:0; height:0;
        opacity:1;
      }
      70%{
        width:500px; height:500px;
        opacity:.8;
      }
      100%{
        width:800px; height:800px;
        opacity:0;
      }
    }

    /* -------------------------------------------------
       CONTENEDOR + ZOOM
    ------------------------------------------------- */
    #viewport{
      position:relative;
      width:100vw; height:100vh;
      overflow:hidden;
      display:flex;               /* <-- CENTRAR */
      align-items:center;
      justify-content:center;
      cursor:grab;
    }
    #solar{
      position:relative;          /* <-- ahora es relativo */
      transform:translate(-50%,-50%) scale(1);
      transform-origin:center;
      transition:transform .1s ease-out;
    }

    /* -------------------------------------------------
       SOL
    ------------------------------------------------- */
    .sun{
      position:absolute;
      width:180px;height:180px;
      top:50%; left:50%;
      margin:-90px 0 0 -90px;
      border-radius:50%;
      background:url('https://www.solarsystemscope.com/textures/download/2k_sun.jpg') center/cover;
      box-shadow:0 0 120px rgba(255,215,0,.4),0 0 300px rgba(255,140,0,.2);
      cursor:pointer;
      z-index:2;
    }

    /* -------------------------------------------------
       ÓRBITAS
    ------------------------------------------------- */
    .orbit{
      position:absolute;
      border:1px solid rgba(255,255,255,.08);
      border-radius:50%;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
    }

    /* -------------------------------------------------
       PLANETAS (5× más lentos)
    ------------------------------------------------- */
    .planet{
      position:absolute;
      border-radius:50%;
      cursor:pointer;
      transform-origin:center;
      transition:transform .3s;
    }
    .planet:hover{transform:scale(1.4);z-index:5;}

    /* ---------- MERCURIO ---------- */
    .mercury{
      width:10px;height:10px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_mercury.jpg') center/cover;
      animation:orbitM 20s linear infinite;   /* 4s ×5 */
    }
    @keyframes orbitM{
      from{transform:rotate(0deg) translateX(55px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(55px) rotate(-360deg);}
    }

    /* ---------- VENUS ---------- */
    .venus{
      width:18px;height:18px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_venus_atmosphere.jpg') center/cover;
      animation:orbitV 35s linear infinite;   /* 7s ×5 */
    }
    @keyframes orbitV{
      from{transform:rotate(0deg) translateX(85px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(85px) rotate(-360deg);}
    }

    /* ---------- TIERRA ---------- */
    .earth{
      width:20px;height:20px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg') center/cover;
      animation:orbitE 50s linear infinite;   /* 10s ×5 */
    }
    @keyframes orbitE{
      from{transform:rotate(0deg) translateX(115px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(115px) rotate(-360deg);}
    }
    .moon{
      width:6px;height:6px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_moon.jpg') center/cover;
      animation:orbitMoon 10s linear infinite;   /* 2s ×5 */
    }
    @keyframes orbitMoon{
      from{transform:rotate(0deg) translateX(30px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(30px) rotate(-360deg);}
    }

    /* ---------- MARTE ---------- */
    .mars{
      width:16px;height:16px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_mars.jpg') center/cover;
      animation:orbitMa 75s linear infinite;   /* 15s ×5 */
    }
    @keyframes orbitMa{
      from{transform:rotate(0deg) translateX(150px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(150px) rotate(-360deg);}
    }

    /* ---------- JUPITER ---------- */
    .jupiter{
      width:36px;height:36px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg') center/cover;
      animation:orbitJu 100s linear infinite;   /* 20s ×5 */
    }
    @keyframes orbitJu{
      from{transform:rotate(0deg) translateX(200px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(200px) rotate(-360deg);}
    }

    /* ---------- SATURNO ---------- */
    .saturn{
      width:34px;height:34px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_saturn.jpg') center/cover;
      animation:orbitSa 150s linear infinite;   /* 30s ×5 */
    }
    @keyframes orbitSa{
      from{transform:rotate(0deg) translateX(260px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(260px) rotate(-360deg);}
    }
    .saturn::before{
      content:'';
      position:absolute;
      inset:-8px;
      border:3px solid rgba(255,215,0,.4);
      border-radius:50%;
      transform:rotateX(55deg);
    }

    /* ---------- URANO ---------- */
    .uranus{
      width:28px;height:28px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_uranus.jpg') center/cover;
      animation:orbitU 175s linear infinite;   /* 35s ×5 */
    }
    @keyframes orbitU{
      from{transform:rotate(0deg) translateX(310px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(310px) rotate(-360deg);}
    }

    /* ---------- NEPTUNO ---------- */
    .neptune{
      width:26px;height:26px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_neptune.jpg') center/cover;
      animation:orbitN 225s linear infinite;   /* 45s ×5 */
    }
    @keyframes orbitN{
      from{transform:rotate(0deg) translateX(360px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(360px) rotate(-360deg);}
    }

    /* -------------------------------------------------
       TOOLTIP (información rápida) – opcional
    ------------------------------------------------- */
    .tooltip{
      position:absolute;
      padding:.4rem .6rem;
      background:rgba(0,0,0,.7);
      border-radius:4px;
      font-size:.75rem;
      pointer-events:none;
      opacity:0;
      transition:opacity .2s;
    }

    /* -------------------------------------------------
       CONTROLES DE ZOOM
    ------------------------------------------------- */
    #controls{
      position:fixed;
      top:1rem; right:1rem;
      display:flex; flex-direction:column; gap:.5rem;
      z-index:10;
    }
    #controls button{
      background:rgba(255,255,255,.1);
      border:none; color:#fff;
      padding:.5rem .8rem;
      font-size:1rem; cursor:pointer;
      border-radius:4px;
    }
    #controls button:hover{background:rgba(255,255,255,.3);}

    /* -------------------------------------------------
       CONSTELACIONES ZODIACALES (SVG)
    ------------------------------------------------- */
    .constellation{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .constellation line{
      stroke:rgba(255,215,0,.5);
      stroke-width:1.2;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div id="viewport">
    <div id="solar">
      <!-- Sol -->
      <div class="sun" id="sun"></div>

      <!-- Supernova (oculta, se activa con JavaScript) -->
      <div class="supernova" id="supernova"></div>

      <!-- Órbitas + planetas -->
      <div class="orbit" style="width:110px;height:110px;"></div>
      <div class="planet mercury"></div>

      <div class="orbit" style="width:170px;height:170px;"></div>
      <div class="planet venus"></div>

      <div class="orbit" style="width:230px;height:230px;"></div>
      <div class="planet earth"></div>
      <div class="planet moon"></div>

      <div class="orbit" style="width:300px;height:300px;"></div>
      <div class="planet mars"></div>

      <div class="orbit" style="width:400px;height:400px;"></div>
      <div class="planet jupiter"></div>

      <div class="orbit" style="width:520px;height:520px;"></div>
      <div class="planet saturn"></div>

      <div class="orbit" style="width:620px;height:620px;"></div>
      <div class="planet uranus"></div>

      <div class="orbit" style="width:720px;height:720px;"></div>
      <div class="planet neptune"></div>
    </div>
  </div>

  <!-- Galaxia / Agujero Negro -->
  <div class="galaxy">
    <div class="milky-way"></div>
    <div class="black-hole"></div>
  </div>

  <!-- Controles de Zoom -->
  <div id="controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">–</button>
    <button id="resetZoom">Reset</button>
  </div>

  <script>
    // ---------- ZOOM ----------
    const viewport = document.getElementById('viewport');
    const solar = document.getElementById('solar');
    let scale = 1;
    const ZOOM_STEP = 0.15;

    function setScale(v){
      scale = Math.min(Math.max(v,0.3),3);
      solar.style.transform = `translate(-50%,-50%) scale(${scale})`;
    }

    document.getElementById('zoomIn').onclick = () => setScale(scale + ZOOM_STEP);
    document.getElementById('zoomOut').onclick = () => setScale(scale - ZOOM_STEP);
    document.getElementById('resetZoom').onclick = () => setScale(1);

    // ---------- SUPER NOVA ----------
    const sun = document.getElementById('sun');
    const supernova = document.getElementById('supernova');

    sun.addEventListener('click', () => {
      supernova.classList.remove('active');               // reinicia si ya estaba
      // Fuerza el re‑renderizado
      void supernova.offsetWidth;
      supernova.classList.add('active');
    });

    // Opcional: volver a ocultar después de la animación
    supernova.addEventListener('animationend', () => {
      supernova.classList.remove('active');
    });
  </script>
</body>
</html>
