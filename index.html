<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Csariel's · Sistema Solar – Supernova + Vía Láctea</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* -------------------------------------------------
       VARIABLES DE COLOR
    ------------------------------------------------- */
    :root{
      --bg-space:#010205;
      --text-primary:#e8f0fe;
      --gold:#ffd700;
    }

    /* -------------------------------------------------
       RESET + BODY
    ------------------------------------------------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg-space);
      overflow:hidden;
      font-family:'Inter',system-ui,sans-serif;
      color:var(--text-primary);
    }

    /* -------------------------------------------------
       ESTRELLAS DE FONDO
    ------------------------------------------------- */
    .stars{
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 20% 30%,rgba(255,255,255,.08),transparent 60%),
        radial-gradient(circle at 78% 70%,rgba(255,255,255,.06),transparent 70%),
        radial-gradient(circle at 45% 15%,rgba(255,255,255,.04),transparent 50%),
        radial-gradient(circle at 10% 80%,rgba(255,255,255,.07),transparent 55%),
        radial-gradient(circle at 90% 20%,rgba(255,255,255,.05),transparent 60%);
      background-size:400px 400px;
      opacity:.35;
      animation:twinkle 8s ease-in-out infinite alternate;
    }
    @keyframes twinkle{0%{opacity:.18}50%{opacity:.38}100%{opacity:.22}}

    /* -------------------------------------------------
       GALAXIA (Vía Láctea + Agujero Negro + Supernova)
    ------------------------------------------------- */
    .galaxy{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .milky-way{
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at bottom,
        rgba(255,255,255,.15), transparent 70%);
      transform:rotate(135deg) scale(1.3);
      filter:blur(2px);
      animation:galaxyPulsate 30s ease-in-out infinite;
    }
    @keyframes galaxyPulsate{
      0%,100%{opacity:.8}
      50%{opacity:.6}
    }
    .black-hole{
      position:absolute;
      top:50%; left:50%;
      width:30px; height:30px;
      margin:-15px 0 0 -15px;
      border-radius:50%;
      background:radial-gradient(circle,#111 0%,#000 70%);
      box-shadow:
        0 0 30px 15px rgba(0,0,0,.9),
        0 0 60px 30px rgba(0,0,0,.7),
        0 0 120px 60px rgba(0,0,0,.5);
      animation:spinBH 12s linear infinite;
    }
    @keyframes spinBH{to{transform:rotate(360deg)}}

    /* ---- SUPERNOVA ---- */
    .supernova{
      position:absolute;
      top:50%; left:50%;
      width:0; height:0;
      margin:-0 0 0 0;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,200,0,.9),transparent 70%);
      opacity:0;
      pointer-events:none;
    }
    .supernova.active{
      animation:explode 2s forwards;
    }
    @keyframes explode{
      0%{
        width:0; height:0;
        opacity:1;
      }
      70%{
        width:500px; height:500px;
        opacity:.8;
      }
      100%{
        width:800px; height:800px;
        opacity:0;
      }
    }

    /* -------------------------------------------------
       CONTENEDOR + ZOOM
    ------------------------------------------------- */
    #viewport{
      position:relative;
      width:100vw; height:100vh;
      overflow:hidden;
      cursor:grab;
    }
    #solar{
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%) scale(1);
      transform-origin:center;
      transition:transform .1s ease-out;
    }

    /* -------------------------------------------------
       SOL
    ------------------------------------------------- */
    .sun{
      position:absolute;
      width:180px;height:180px;
      top:50%; left:50%;
      margin:-90px 0 0 -90px;
      border-radius:50%;
      background:url('https://www.solarsystemscope.com/textures/download/2k_sun.jpg') center/cover;
      box-shadow:0 0 120px rgba(255,215,0,.4),0 0 300px rgba(255,140,0,.2);
    }

    /* -------------------------------------------------
       ÓRBITAS
    ------------------------------------------------- */
    .orbit{
      position:absolute;
      border:1px solid rgba(255,255,255,.08);
      border-radius:50%;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
    }

    /* -------------------------------------------------
       PLANETAS (5× más lentos)
    ------------------------------------------------- */
    .planet{
      position:absolute;
      border-radius:50%;
      cursor:pointer;
      transform-origin:center;
      transition:transform .3s;
    }
    .planet:hover{transform:scale(1.4);z-index:5;}

    /* ----- MERCURIO ----- */
    .mercury{
      width:10px;height:10px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_mercury.jpg') center/cover;
      animation:orbitM 20s linear infinite;   /* 4s ×5 */
    }
    @keyframes orbitM{
      from{transform:rotate(0deg) translateX(55px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(55px) rotate(-360deg);}
    }

    /* ----- VENUS ----- */
    .venus{
      width:18px;height:18px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_venus_atmosphere.jpg') center/cover;
      animation:orbitV 35s linear infinite;   /* 7s ×5 */
    }
    @keyframes orbitV{
      from{transform:rotate(0deg) translateX(85px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(85px) rotate(-360deg);}
    }

    /* ----- TIERRA ----- */
    .earth{
      width:20px;height:20px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg') center/cover;
      animation:orbitE 50s linear infinite;   /* 10s ×5 */
    }
    @keyframes orbitE{
      from{transform:rotate(0deg) translateX(115px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(115px) rotate(-360deg);}
    }
    .moon{
      width:6px;height:6px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_moon.jpg') center/cover;
      animation:orbitMoon 10s linear infinite;   /* 2s ×5 */
    }
    @keyframes orbitMoon{
      from{transform:rotate(0deg) translateX(30px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(30px) rotate(-360deg);}
    }

    /* ----- MARS ----- */
    .mars{
      width:16px;height:16px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_mars.jpg') center/cover;
      animation:orbitMa 75s linear infinite;   /* 15s ×5 */
    }
    @keyframes orbitMa{
      from{transform:rotate(0deg) translateX(150px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(150px) rotate(-360deg);}
    }

    /* ----- JUPITER ----- */
    .jupiter{
      width:36px;height:36px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg') center/cover;
      animation:orbitJu 100s linear infinite;   /* 20s ×5 */
    }
    @keyframes orbitJu{
      from{transform:rotate(0deg) translateX(200px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(200px) rotate(-360deg);}
    }

    /* ----- SATURN ----- */
    .saturn{
      width:34px;height:34px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_saturn.jpg') center/cover;
      animation:orbitSa 150s linear infinite;   /* 30s ×5 */
    }
    @keyframes orbitSa{
      from{transform:rotate(0deg) translateX(260px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(260px) rotate(-360deg);}
    }
    .saturn::before{
      content:'';
      position:absolute;
      inset:-8px;
      border:3px solid rgba(255,215,0,.4);
      border-radius:50%;
      transform:rotateX(55deg);
    }

    /* ----- URANUS ----- */
    .uranus{
      width:28px;height:28px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_uranus.jpg') center/cover;
      animation:orbitU 175s linear infinite;   /* 35s ×5 */
    }
    @keyframes orbitU{
      from{transform:rotate(0deg) translateX(310px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(310px) rotate(-360deg);}
    }

    /* ----- NEPTUNE ----- */
    .neptune{
      width:26px;height:26px;
      background:url('https://www.solarsystemscope.com/textures/download/2k_neptune.jpg') center/cover;
      animation:orbitN 225s linear infinite;   /* 45s ×5 */
    }
    @keyframes orbitN{
      from{transform:rotate(0deg) translateX(360px) rotate(0deg);}
      to{transform:rotate(360deg) translateX(360px) rotate(-360deg);}
    }

    /* -------------------------------------------------
       TOOLTIP (información rápida)
    ------------------------------------------------- */
    .tooltip{
      position:absolute;
      padding:.4rem .6rem;
      background:rgba(0,0,0,.7);
      border-radius:4px;
      font-size:.75rem;
      pointer-events:none;
      opacity:0;
      transition:opacity .2s;
    }

    /* -------------------------------------------------
       CONTROLES DE ZOOM
    ------------------------------------------------- */
    #controls{
      position:fixed;
      top:1rem; right:1rem;
      display:flex; flex-direction:column; gap:.5rem;
      z-index:10;
    }
    #controls button{
      background:rgba(255,255,255,.1);
      border:none; color:#fff;
      padding:.5rem .8rem;
      font-size:1rem; cursor:pointer;
      border-radius:4px;
    }
    #controls button:hover{background:rgba(255,255,255,.3);}

    /* -------------------------------------------------
       CONSTELACIONES ZODIACALES (SVG)
    ------------------------------------------------- */
    .constellation{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .constellation line{
      stroke:rgba(255,215,0,.5);
      stroke-width:1.2;
      stroke-dasharray:4 2;
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <!-- GALAXIA -->
  <div class="galaxy">
    <div class="milky-way"></div>
    <div class="black-hole"></div>
    <div class="supernova" id="supernova"></div>
  </div>

  <div id="viewport">
    <div id="solar">

      <!-- Sol -->
      <div class="sun"></div>

      <!-- Órbitas -->
      <div class="orbit" style="width:110px;height:110px;"></div><!-- Mercurio -->
      <div class="orbit" style="width:170px;height:170px;"></div><!-- Venus -->
      <div class="orbit" style="width:230px;height:230px;"></div><!-- Tierra -->
      <div class="orbit" style="width:300px;height:300px;"></div><!-- Marte -->
      <div class="orbit" style="width:400px;height:400px;"></div><!-- Júpiter -->
      <div class="orbit" style="width:520px;height:520px;"></div><!-- Saturno -->
      <div class="orbit" style="width:620px;height:620px;"></div><!-- Urano -->
      <div class="orbit" style="width:720px;height:720px;"></div><!-- Neptuno -->

      <!-- MERCURIO -->
      <div class="planet mercury" data-name="Mercurio"></div>

      <!-- VENUS -->
      <div class="planet venus" data-name="Venus"></div>

      <!-- TIERRA + LUNA -->
      <div class="planet earth" data-name="Tierra">
        <div class="planet moon" data-name="Luna"></div>
      </div>

      <!-- MARTE -->
      <div class="planet mars" data-name="Marte"></div>

      <!-- JÚPITER -->
      <div class="planet jupiter" data-name="Júpiter"></div>

      <!-- SATURNO -->
      <div class="planet saturn" data-name="Saturno"></div>

      <!-- URANO -->
      <div class="planet uranus" data-name="Urano"></div>

      <!-- NEPTUNO -->
      <div class="planet neptune" data-name="Neptuno"></div>
    </div>
  </div>

  <!-- TOOLTIP -->
  <div class="tooltip" id="tooltip"></div>

  <!-- CONTROLES -->
  <div id="controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
    <button id="triggerSN">Supernova</button>
  </div>

  <script>
    // ----------------- ZOOM -----------------
    const viewport = document.getElementById('viewport');
    const solar = document.getElementById('solar');
    let scale = 1;
    const ZOOM_FACTOR = 0.15;

    document.getElementById('zoomIn').onclick = () => {
      scale = Math.min(scale + ZOOM_FACTOR, 3);
      solar.style.transform = `translate(-50%,-50%) scale(${scale})`;
    };
    document.getElementById('zoomOut').onclick = () => {
      scale = Math.max(scale - ZOOM_FACTOR, 0.3);
      solar.style.transform = `translate(-50%,-50%) scale(${scale})`;
    };

    // ----------------- TOOLTIP -----------------
    const tooltip = document.getElementById('tooltip');
    const planetData = {
      Mercurio:{masa:'3.30×10²³ kg',radio:'2 440 km',periodo:'88 días'},
      Venus:{masa:'4.87×10²⁴ kg',radio:'6 052 km',periodo:'225 días'},
      Tierra:{masa:'5.97×10²⁴ kg',radio:'6 371 km',periodo:'365 días'},
      Luna:{masa:'7.35×10²² kg',radio:'1 738 km',periodo:'27 días'},
      Marte:{masa:'6.42×10²³ kg',radio:'3 390 km',periodo:'687 días'},
      Júpiter:{masa:'1.90×10²⁷ kg',radio:'69 911 km',periodo:'12 años'},
      Saturno:{masa:'5.68×10²⁶ kg',radio:'58 232 km',periodo:'29 años'},
      Urano:{masa:'8.68×10²⁵ kg',radio:'25 362 km',periodo:'84 años'},
      Neptuno:{masa:'1.02×10²⁶ kg',radio:'24 622 km',periodo:'165 años'},
    };

    document.querySelectorAll('.planet').forEach(p => {
      p.onmouseenter = (e) => {
        const name = p.dataset.name;
        const data = planetData[name];
        tooltip.innerHTML = `<strong>${name}</strong><br>Masa: ${data.masa}<br>Radio: ${data.radio}<br>Órbita: ${data.periodo}`;
        tooltip.style.opacity = '1';
      };
      p.onmousemove = (e) => {
        tooltip.style.left = (e.pageX + 15) + 'px';
        tooltip.style.top = (e.pageY + 15) + 'px';
      };
      p.onmouseleave = () => tooltip.style.opacity = '0';
    });

    // ----------------- SUPERNOVA EVENT -----------------
    const btnSupernova = document.getElementById('btnNova');
    btnSupernova.onclick = () => {
      const nova = document.createElement('div');
      nova.className = 'supernova';
      document.getElementById('solar').appendChild(nova);
      
      // Desvanecer el sol y los planetas para dramatismo
      document.getElementById('solar').style.filter = 'brightness(0.2)';
      
      setTimeout(() => {
        nova.remove();
        document.getElementById('solar').style.filter = 'brightness(1)';
      }, 4000);
    };
  });
</script>
</body>
</html>
