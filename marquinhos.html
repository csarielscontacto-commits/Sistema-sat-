<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marquinhos – Robot Talavera</title>

  <!-- Fuente “cursiva” para la placa (opcional) -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------
       VARIABLES DE COLOR (cambio rápido)
       ------------------------------------------------- */
    :root {
      --ceramica-bg:   #fdfdfd;   /* blanco brillante */
      --bordes:       #1a237e;   /* azul Talavera */
      --rubor:        #ffccd2;   /* mejillas rosadas */
      --texto-placa:  #0d1b5b;
      --anim-speed:   3s;        /* velocidad global de animaciones */
    }

    /* -------------------------------------------------
       ESTILO GLOBAL
       ------------------------------------------------- */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e0f2fe;               /* fondo suave */
      perspective: 800px;                /* 3D */
      font-family: system-ui, sans-serif;
    }

    /* -------------------------------------------------
       CONTENEDOR PRINCIPAL
       ------------------------------------------------- */
    .robot {
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
    }

    /* -------------------------------------------------
       CABEZA
       ------------------------------------------------- */
    .head {
      position: relative;
      width: 160px;
      height: 140px;
      background: var(--ceramica-bg);
      border: 4px solid var(--bordes);
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 12px 20px rgba(0,0,0,.15), inset 0 0 12px rgba(255,255,255,.6);
      overflow: hidden;
      animation: head-swing var(--anim-speed) ease-in-out infinite alternate;
    }

    /* Patrón Talavera (SVG) */
    .head::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
  <defs>\
    <pattern id="talavera" width="40" height="40" patternUnits="userSpaceOnUse">\
      <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/>\
    </pattern>\
  </defs>\
  <rect width="200" height="200" fill="url(%23talavera)"/>\
</svg>');
      background-size: 40px 40px;
      opacity: .4;
    }

    /* ---------- OJOS ---------- */
    .eye {
      position: absolute;
      width: 35px;
      height: 45px;
      background: #111;
      border-radius: 50%;
      overflow: hidden;
      top: 35px;
    }
    .eye.left  { left: 25px; }
    .eye.right { right: 25px; }

    .eye::before {                 /* esclera */
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 50%;
      transform: scaleY(0.7);      /* forma alargada */
    }

    .pupil {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #000;
      border-radius: 50%;
      top: 12px;
      left: 12px;
      animation: pupil-look var(--anim-speed) linear infinite;
    }

    /* ---------- BOCA ---------- */
    .mouth {
      position: absolute;
      bottom: 25px;
      left: 50%;
      width: 30px;
      height: 15px;
      border-bottom: 4px solid var(--bordes);
      border-radius: 0 0 50% 50%;
      transform: translateX(-50%);
    }

    /* ---------- MEJILLAS ---------- */
    .cheek {
      position: absolute;
      bottom: 30px;
      width: 20px;
      height: 15px;
      background: var(--rubor);
      border-radius: 50%;
      filter: blur(3px);
    }
    .cheek.left  { left: 15px; }
    .cheek.right { right: 15px; }

    /* -------------------------------------------------
       CUERPO
       ------------------------------------------------- */
    .body {
      position: relative;
      width: 140px;
      height: 160px;
      background: var(--ceramica-bg);
      border: 4px solid var(--bordes);
      border-radius: 20px 20px 30px 30px;
      margin-top: -10px;               /* superpone con cabeza */
      box-shadow: 0 15px 25px rgba(0,0,0,.12), inset 0 0 12px rgba(255,255,255,.6);
      overflow: hidden;
      animation: breathe var(--anim-speed) ease-in-out infinite;
    }

    .body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
  <defs>\
    <pattern id="talavera2" width="40" height="40" patternUnits="userSpaceOnUse">\
      <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/>\
    </pattern>\
  </defs>\
  <rect width="200" height="200" fill="url(%23talavera2)"/>\
</svg>');
      background-size: 40px 40px;
      opacity: .3;
    }

    /* -------------------------------------------------
       BRAZOS – Articulados
       ------------------------------------------------- */
    .arm {
      position: absolute;
      width: 20px;
      height: 80px;
      background: var(--ceramica-bg);
      border: 3px solid var(--bordes);
      border-radius: 10px;
      transform-origin: top;               /* pivote en el hombro */
    }
    .arm.right { right: -10px; top: 30px; transform: rotate(10deg); }
    .arm.left  { left: -10px;  top: 30px; transform: rotate(-10deg); }

    .forearm {
      position: absolute;
      width: 18px;
      height: 70px;
      background: var(--ceramica-bg);
      border: 2px solid var(--bordes);
      border-radius: 8px;
      top: 70px;                     /* se engancha al extremo del brazo */
      left: 1px;
      transform-origin: top;         /* pivote en el codo */
    }

    .hand {
      position: absolute;
      width: 30px;
      height: 30px;
      background: var(--ceramica-bg);
      border: 2px solid var(--bordes);
      border-radius: 50%;
      top: 65px;                     /* extremo del antebrazo */
      left: -6px;
      transform-origin: center;
    }

    /* Dedos (estilizados como “pinceles” redondeados) */
    .finger {
      position: absolute;
      width: 6px;
      height: 12px;
      background: var(--ceramica-bg);
      border: 1px solid var(--bordes);
      border-radius: 3px;
      top: 2px;
    }
    .finger:nth-child(1) { left: 4px; }
    .finger:nth-child(2) { left: 12px; }
    .finger:nth-child(3) { left: 20px; }

    /* -------------------------------------------------
       ANIMACIONES
       ------------------------------------------------- */
    @keyframes head-swing {
      0%   { transform: rotateY(-5deg); }
      100% { transform: rotateY(5deg); }
    }

    @keyframes breathe {
      0%,100% { transform: translateY(0); }
      50%    { transform: translateY(4px); }
    }

    /* Pupila hace “look‑at” horizontal */
    @keyframes pupil-look {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(8px); }   /* derecha */
      50%  { transform: translateX(0); }
      75%  { transform: translateX(-8px); }  /* izquierda */
      100% { transform: translateX(0); }
    }

    /* Pequeños gestos de brazos (ejemplo) */
    .arm.right   { animation: arm-wave-right var(--anim-speed) infinite; }
    .arm.left    { animation: arm-wave-left var(--anim-speed) infinite; }

    @keyframes arm-wave-right {
      0%,100% { transform: rotate(10deg); }
      50%     { transform: rotate(40deg); }
    }
    @keyframes arm-wave-left {
      0%,100% { transform: rotate(-10deg); }
      50%     { transform: rotate(-40deg); }
    }

  </style>
</head>

<body>
  <div class="robot">
    <!-- ---------- CABEZA ---------- -->
    <div class="head">
      <!-- Antenas (opcionales) -->
      <div class="antenna left"></div>
      <div class="antenna right"></div>

      <!-- Ojos -->
      <div class="eye left">
        <div class="pupil"></div>
      </div>
      <div class="eye right">
        <div class="pupil"></div>
      </div>

      <!-- Boca y mejillas -->
      <div class="mouth"></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
    </div>

    <!-- ---------- CUERPO ---------- -->
    <div class="body">
      <!-- BRAZO DERECHO -->
      <div class="arm arm-right">
        <div class="forearm">
          <div class="hand">
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
          </div>
        </div>
      </div>

      <!-- BRAZO IZQUIERDO -->
      <div class="arm arm-left">
        <div class="forearm">
          <div class="hand">
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
