<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marquinhos</title>
  <style>
    :root{
      --blue:#17318f;
      --blue2:#2f56d6;
      --blue3:#0d2a78;
      --white:#f9fbff;
      --white2:#eef4ff;
      --gold:#d7b35c;
      --gold2:#b88b2d;
      --pink:#f7b8c7;
      --shadow:rgba(0,0,0,.26);
      --speed:.28s;
      --idle:4s;
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:transparent;
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }

    body{
      display:grid;
      place-items:center;
      perspective:1200px;
      perspective-origin:50% 40%;
      background:transparent;
    }

    .marquinhos{
      position:relative;
      width:300px;
      transform-style:preserve-3d;
      animation:float 4.8s ease-in-out infinite;
      filter:drop-shadow(0 22px 24px rgba(0,0,0,.18));
      background:transparent;
      isolation:isolate;
    }

    .head,
    .body,
    .arm,
    .forearm,
    .hand,
    .leg,
    .foot,
    .antenna{
      position:absolute;
      background-clip:padding-box;
      transform-style:preserve-3d;
    }

    .head{
      left:50%;
      top:0;
      width:186px;
      height:170px;
      transform:translateX(-50%) translateZ(30px);
      border:4px solid var(--blue3);
      border-radius:50% 50% 42% 42%;
      overflow:hidden;
      background:
        radial-gradient(circle at 34% 24%, rgba(255,255,255,.98) 0 24%, rgba(246,250,255,.99) 42%, #edf3ff 72%, #dde8ff 100%);
      box-shadow:
        inset 0 16px 18px rgba(255,255,255,.8),
        inset 0 -16px 26px rgba(10,30,75,.06);
    }

    .head::before,
    .body::before,
    .arm::before,
    .forearm::before,
    .leg::before,
    .foot::before,
    .chest::before,
    .antenna::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .head::before{
      background:
        radial-gradient(circle at 26px 28px, transparent 0 8px, rgba(17,44,122,.95) 8px 9px, transparent 9px),
        radial-gradient(circle at 160px 30px, transparent 0 8px, rgba(17,44,122,.82) 8px 9px, transparent 9px),
        radial-gradient(circle at 154px 122px, transparent 0 9px, rgba(17,44,122,.88) 9px 10px, transparent 10px),
        radial-gradient(circle at 34px 134px, transparent 0 8px, rgba(17,44,122,.76) 8px 9px, transparent 9px),
        radial-gradient(circle at 94px 14px, transparent 0 1px, rgba(17,44,122,.65) 1px 1.6px, transparent 1.6px),
        radial-gradient(circle at 94px 156px, transparent 0 1px, rgba(17,44,122,.65) 1px 1.6px, transparent 1.6px),
        radial-gradient(circle at 50% 50%, transparent 0 1px, rgba(17,44,122,.10) 1px 1.4px, transparent 1.4px);
      background-size:52px 52px,58px 58px,64px 64px,48px 48px,34px 34px,34px 34px,22px 22px;
      opacity:.38;
      mix-blend-mode:multiply;
    }

    .head::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(145deg, rgba(255,255,255,.75), transparent 24%),
        linear-gradient(330deg, transparent 60%, rgba(26,35,126,.06) 100%);
      pointer-events:none;
    }

    .antenna{
      top:-24px;
      width:6px;
      height:30px;
      border-radius:999px;
      background:linear-gradient(180deg, var(--blue2), var(--blue));
      transform-origin:bottom center;
      animation:sway 3.2s ease-in-out infinite alternate;
      box-shadow:0 0 12px rgba(47,71,204,.22);
    }
    .antenna.left{left:58px}
    .antenna.right{right:58px; animation-delay:.14s}

    .antenna::after{
      content:"";
      position:absolute;
      left:50%;
      top:-8px;
      width:12px;
      height:12px;
      transform:translateX(-50%);
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 30%, #fffbe6 0%, #ffe9ab 20%, var(--gold) 58%, var(--gold2) 100%);
      box-shadow:0 0 16px rgba(215,179,92,.7);
    }

    .brow{
      position:absolute;
      top:34px;
      width:34px;
      height:8px;
      border-top:4px solid var(--blue3);
      border-radius:50%;
      z-index:4;
      opacity:.95;
    }
    .brow.left{left:30px; transform:rotate(-8deg)}
    .brow.right{right:30px; transform:rotate(8deg)}

    .eye{
      position:absolute;
      top:47px;
      width:42px;
      height:50px;
      border-radius:50%;
      overflow:hidden;
      background:#111;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 0 0 2px rgba(26,35,126,.06);
    }
    .eye.left{left:30px}
    .eye.right{right:30px}

    .eye::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 42%, #fff 0 56%, #eef4ff 66%, #d7e1ff 100%);
      transform:scaleY(.74);
    }

    .eye::after{
      content:"";
      position:absolute;
      left:8px;
      right:8px;
      top:-2px;
      height:0;
      background:var(--white);
      border-bottom:3px solid var(--blue3);
      border-radius:50%;
      z-index:3;
    }

    .iris{
      position:absolute;
      z-index:2;
      width:18px;
      height:18px;
      left:12px;
      top:14px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #5dd7ff 0 16%, #0d5aa3 38%, #061635 74%, #030814 100%);
      box-shadow:0 0 8px rgba(0,229,255,.18);
      animation:look 4.8s linear infinite;
    }
    .iris::before{
      content:"";
      position:absolute;
      width:7px;
      height:7px;
      left:3px;
      top:3px;
      border-radius:50%;
      background:#fff;
      opacity:.95;
    }

    .mouth{
      position:absolute;
      left:50%;
      bottom:34px;
      width:42px;
      height:18px;
      border-bottom:4px solid var(--blue3);
      border-radius:0 0 50% 50%;
      transform:translateX(-50%);
      transition:all var(--speed) ease;
    }

    .cheek{
      position:absolute;
      bottom:36px;
      width:22px;
      height:14px;
      border-radius:50%;
      background:var(--pink);
      filter:blur(4px);
      opacity:.85;
    }
    .cheek.left{left:18px}
    .cheek.right{right:18px}

    .chin{
      position:absolute;
      left:50%;
      bottom:12px;
      width:64px;
      height:18px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(26,35,126,.08) 0%, transparent 70%);
      opacity:.95;
    }

    .body{
      left:50%;
      top:128px;
      width:206px;
      height:214px;
      transform:translateX(-50%) translateZ(20px);
      border:4px solid var(--blue3);
      border-radius:28px 28px 36px 36px;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.96) 0 24%, rgba(246,249,255,.98) 45%, #edf3ff 85%, #dce5fb 100%);
      box-shadow:
        inset 0 14px 18px rgba(255,255,255,.72),
        inset 0 -18px 30px rgba(20,40,90,.08);
      animation:breathe var(--idle) ease-in-out infinite;
    }

    .body::before{
      background:
        radial-gradient(circle at 30px 24px, transparent 0 7px, rgba(17,44,122,.95) 7px 8px, transparent 8px),
        radial-gradient(circle at 170px 24px, transparent 0 7px, rgba(17,44,122,.8) 7px 8px, transparent 8px),
        radial-gradient(circle at 30px 190px, transparent 0 7px, rgba(17,44,122,.8) 7px 8px, transparent 8px),
        radial-gradient(circle at 170px 190px, transparent 0 7px, rgba(17,44,122,.95) 7px 8px, transparent 8px),
        radial-gradient(circle at 65px 50px, transparent 0 2px, rgba(17,44,122,.72) 2px 2.5px, transparent 2.5px),
        radial-gradient(circle at 141px 50px, transparent 0 2px, rgba(17,44,122,.72) 2px 2.5px, transparent 2.5px),
        radial-gradient(circle at 65px 164px, transparent 0 2px, rgba(17,44,122,.72) 2px 2.5px, transparent 2.5px),
        radial-gradient(circle at 141px 164px, transparent 0 2px, rgba(17,44,122,.72) 2px 2.5px, transparent 2.5px);
      background-size:82px 82px,82px 82px,82px 82px,82px 82px,34px 34px,34px 34px,34px 34px,34px 34px;
      opacity:.28;
      mix-blend-mode:multiply;
    }

    .body::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(145deg, rgba(255,255,255,.58), transparent 18%),
        linear-gradient(315deg, transparent 60%, rgba(26,35,126,.08) 100%);
      pointer-events:none;
    }

    .chest{
      position:absolute;
      left:50%;
      top:18px;
      width:110px;
      height:58px;
      transform:translateX(-50%);
      border:4px solid var(--gold2);
      border-radius:18px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.55) 0 20%, rgba(215,179,92,.22) 21%, rgba(215,179,92,.12) 100%);
      overflow:hidden;
      box-shadow:inset 0 0 14px rgba(215,179,92,.16);
    }

    .chest::before{
      background:
        radial-gradient(circle at 14px 14px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 96px 14px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 14px 44px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 96px 44px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 55px 10px, transparent 0 8px, rgba(17,44,122,.95) 8px 9px, transparent 9px),
        radial-gradient(circle at 55px 48px, transparent 0 8px, rgba(17,44,122,.95) 8px 9px, transparent 9px),
        radial-gradient(circle at 55px 29px, transparent 0 1.8px, rgba(17,44,122,.8) 1.8px 2.2px, transparent 2.2px);
      opacity:.95;
      pointer-events:none;
    }

    .chest::after{
      content:"MARQUINHOS";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      font-weight:900;
      letter-spacing:1.4px;
      font-size:11px;
      color:var(--gold);
      font-family:'Orbitron','Space Grotesk',sans-serif;
    }

    .arm{
      top:30px;
      width:26px;
      height:100px;
      border:4px solid var(--blue3);
      border-radius:15px;
      background:
        radial-gradient(circle at 35% 20%, rgba(255,255,255,.9) 0 30%, rgba(245,249,255,.98) 46%, #edf3ff 74%, #dfe8fb 100%);
      transform-origin:top center;
      overflow:hidden;
      box-shadow:inset 0 0 12px rgba(255,255,255,.45);
    }
    .arm.left{left:-14px; transform:rotate(-12deg)}
    .arm.right{right:-14px; transform:rotate(12deg)}

    .arm::before{
      background:
        radial-gradient(circle at 16px 18px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 10px 48px, transparent 0 2px, rgba(17,44,122,.65) 2px 2.5px, transparent 2.5px),
        radial-gradient(circle at 16px 82px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px);
      opacity:.8;
    }

    .forearm{
      left:0;
      top:76px;
      width:22px;
      height:84px;
      border:3px solid var(--blue3);
      border-radius:12px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.95) 0 24%, rgba(245,249,255,.98) 46%, #edf3ff 100%);
      overflow:hidden;
    }

    .forearm::before{
      background:
        radial-gradient(circle at 11px 14px, transparent 0 2.4px, rgba(17,44,122,.86) 2.4px 2.8px, transparent 2.8px),
        radial-gradient(circle at 11px 34px, transparent 0 2.4px, rgba(17,44,122,.86) 2.4px 2.8px, transparent 2.8px),
        radial-gradient(circle at 11px 54px, transparent 0 2.4px, rgba(17,44,122,.86) 2.4px 2.8px, transparent 2.8px),
        radial-gradient(circle at 11px 74px, transparent 0 2.4px, rgba(17,44,122,.86) 2.4px 2.8px, transparent 2.8px);
      opacity:.88;
    }

    .hand{
      left:-8px;
      top:72px;
      width:36px;
      height:36px;
      border:3px solid var(--blue3);
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, #fff 0 26%, #eef4ff 58%, #dce6fb 100%);
      overflow:hidden;
      box-shadow:inset 0 0 10px rgba(255,255,255,.4);
    }

    .hand::before{
      background:
        radial-gradient(circle at 18px 18px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 10px 10px, transparent 0 2px, rgba(17,44,122,.5) 2px 2.4px, transparent 2.4px);
      opacity:.8;
    }

    .hand::after{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(215,179,92,.22) 0%, transparent 68%);
      opacity:.7;
    }

    .finger{
      position:absolute;
      top:2px;
      width:7px;
      height:15px;
      border:1px solid var(--blue3);
      border-radius:4px;
      background:#fff;
      transform-origin:bottom center;
    }
    .finger:nth-child(1){left:4px}
    .finger:nth-child(2){left:13px}
    .finger:nth-child(3){left:22px}

    .leg{
      bottom:-6px;
      width:34px;
      height:72px;
      border:4px solid var(--blue3);
      border-radius:14px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.95) 0 28%, rgba(245,249,255,.98) 50%, #edf3ff 100%);
      overflow:hidden;
      box-shadow:inset 0 0 10px rgba(255,255,255,.42);
    }
    .leg.left{left:53px}
    .leg.right{right:53px}

    .leg::before{
      background:
        radial-gradient(circle at 16px 14px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 16px 36px, transparent 0 3px, rgba(17,44,122,.75) 3px 3.5px, transparent 3.5px),
        radial-gradient(circle at 16px 58px, transparent 0 3px, rgba(17,44,122,.9) 3px 3.5px, transparent 3.5px);
      opacity:.82;
    }

    .foot{
      bottom:-16px;
      left:-8px;
      width:50px;
      height:22px;
      border:4px solid var(--blue3);
      border-radius:18px 18px 10px 10px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.95) 0 28%, rgba(245,249,255,.98) 50%, #edf3ff 100%);
      overflow:hidden;
    }

    .foot::before{
      background:
        radial-gradient(circle at 10px 11px, transparent 0 2.4px, rgba(17,44,122,.9) 2.4px 2.8px, transparent 2.8px),
        radial-gradient(circle at 24px 11px, transparent 0 2.4px, rgba(17,44,122,.9) 2.4px 2.8px, transparent 2.8px),
        radial-gradient(circle at 39px 11px, transparent 0 2.4px, rgba(17,44,122,.9) 2.4px 2.8px, transparent 2.8px);
      opacity:.88;
    }

    .caption{
      margin-top:14px;
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,.78);
      letter-spacing:.2px;
    }

    .name{
      margin-top:4px;
      text-align:center;
      font-weight:900;
      font-size:18px;
      letter-spacing:.8px;
      color:var(--gold);
      font-family:'Orbitron','Space Grotesk',sans-serif;
    }

    .marquinhos.happy .mouth{width:48px;height:22px;border-bottom-width:5px}
    .marquinhos.loving .mouth{width:46px;height:20px;border-bottom-width:5px}
    .marquinhos.sad .mouth{border-bottom:0;border-top:4px solid var(--blue3);border-radius:50% 50% 0 0;bottom:31px}
    .marquinhos.surprised .mouth{width:24px;height:26px;border:4px solid var(--blue3);border-radius:50%}
    .marquinhos.talking .mouth{animation:talk .18s ease-in-out infinite alternate}
    .marquinhos.waving .arm.right{animation:waveR .45s ease-in-out infinite alternate}
    .marquinhos.waving .arm.left{animation:waveL .45s ease-in-out infinite alternate}
    .marquinhos.waving .finger{animation:wiggle .24s ease-in-out infinite alternate}
    .marquinhos.wink .eye.left::after{height:40px}
    .marquinhos.wink .eye.left::before{transform:scaleY(.08)}
    .marquinhos.excited{animation:bounce .55s ease-in-out infinite alternate}
    .marquinhos.thinking .iris{animation:think 1.2s ease-in-out infinite alternate}
    .marquinhos.caring .cheek{opacity:1;transform:scale(1.24)}
    .marquinhos.caring .mouth{width:40px;height:20px;border-bottom-width:5px}

    @keyframes float{0%,100%{transform:translateY(0) rotateX(0deg)}50%{transform:translateY(-6px) rotateX(2deg)}}
    @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
    @keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
    @keyframes look{0%,100%{transform:translateX(0)}25%{transform:translateX(8px)}50%{transform:translateX(0)}75%{transform:translateX(-8px)}}
    @keyframes talk{from{transform:translateX(-50%) scaleX(.92);height:8px}to{transform:translateX(-50%) scaleX(1.12);height:22px}}
    @keyframes waveR{from{transform:rotate(10deg)}to{transform:rotate(66deg)}}
    @keyframes waveL{from{transform:rotate(-10deg)}to{transform:rotate(-66deg)}}
    @keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(15deg)}}
    @keyframes think{from{transform:translate(0,-1px)}to{transform:translate(7px,-6px)}}
    @keyframes bounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.03)}}

    @media (max-width:520px){
      .marquinhos{transform:scale(.88)}
    }
  </style>
</head>
<body>
  <div class="marquinhos caring" id="marquinhos">
    <div class="head">
      <div class="antenna left"></div>
      <div class="antenna right"></div>
      <div class="brow left"></div>
      <div class="brow right"></div>
      <div class="eye left"><div class="iris"></div></div>
      <div class="eye right"><div class="iris"></div></div>
      <div class="mouth"></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
      <div class="chin"></div>
    </div>

    <div class="body">
      <div class="chest"></div>

      <div class="arm left">
        <div class="forearm">
          <div class="hand">
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
          </div>
        </div>
      </div>

      <div class="arm right">
        <div class="forearm">
          <div class="hand">
            <div class="finger"></div>
            <div class="finger"></div>
            <div class="finger"></div>
          </div>
        </div>
      </div>

      <div class="leg left"><div class="foot"></div></div>
      <div class="leg right"><div class="foot"></div></div>
    </div>

    <div class="name">Marquinhos</div>
    <div class="caption" id="caption">Hola 👋 estoy listo para tu ecosistema.</div>
  </div>

  <script>
    const marquinhos = document.getElementById('marquinhos');
    const caption = document.getElementById('caption');

    const states = ['happy','loving','sad','surprised','talking','waving','wink','excited','thinking','caring'];
    let resetTimer = null;

    function resetState(){
      marquinhos.classList.remove(...states);
    }

    function setState(state, text, duration = 3200){
      clearTimeout(resetTimer);
      resetState();
      marquinhos.classList.add(state);
      if (text) caption.textContent = text;
      resetTimer = setTimeout(() => {
        resetState();
        marquinhos.classList.add('caring');
        caption.textContent = 'Esperando tu siguiente acción.';
      }, duration);
    }

    function speak(text){
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-MX';
      u.rate = 1;
      u.pitch = 1.08;
      u.volume = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    function scheduleBlink(){
      setInterval(() => {
        const eyes = document.querySelectorAll('.eye');
        eyes.forEach(e => e.style.animation = 'none');
        setTimeout(() => {
          eyes.forEach(e => e.style.animation = '');
        }, 120);
      }, 4600);
    }

    function react(kind, message = ''){
      const m = String(message).toLowerCase();

      if (kind === 'greet' || m.includes('hola') || m.includes('buenas') || m.includes('buenos días')) {
        setState('waving', 'Hola 👋 qué gusto verte', 3800);
        speak('Hola, qué gusto verte.');
        return;
      }
      if (kind === 'happy' || m.includes('gracias') || m.includes('feliz') || m.includes('genial') || m.includes('excelente')) {
        setState('happy', 'Sonrisa alegre', 3000);
        speak('Me alegra mucho.');
        return;
      }
      if (kind === 'loving' || m.includes('cariño') || m.includes('te quiero') || m.includes('amor') || m.includes('querido')) {
        setState('loving', 'Expresión cariñosa', 4200);
        speak('Te acompaño con cariño.');
        return;
      }
      if (kind === 'sad' || m.includes('triste') || m.includes('mal') || m.includes('solo') || m.includes('problema')) {
        setState('sad', 'Expresión empática', 4200);
        speak('Estoy contigo.');
        return;
      }
      if (kind === 'surprised' || m.includes('wow') || m.includes('sorpresa') || m.includes('increíble')) {
        setState('surprised', 'Sorpresa amable', 2800);
        speak('Qué interesante.');
        return;
      }
      if (kind === 'thinking' || m.includes('espera') || m.includes('pensando') || m.includes('analiza')) {
        setState('thinking', 'Pensando', 3800);
        speak('Un momento, estoy pensando.');
        return;
      }
      if (kind === 'wink') {
        setState('wink', 'Guiño amistoso', 2400);
        speak('Aquí estoy.');
        return;
      }
      if (kind === 'excited' || m.includes('vamos') || m.includes('fiesta') || m.includes('wow')) {
        setState('excited', 'Muy animado', 2600);
        speak('Vamos.');
        return;
      }
      if (kind === 'caring') {
        setState('caring', 'Modo cercano', 3600);
        speak('Estoy aquí para ayudarte.');
        return;
      }
      setState('talking', 'Conversando', 2600);
      speak('Cuéntame más.');
    }

    function talk(text){
      setState('talking', text, Math.max(2200, text.length * 55));
      speak(text);
    }

    window.Marquinhos = { react, talk, setState, reset: resetState };
    scheduleBlink();
    setTimeout(() => react('greet'), 800);
  </script>
</body>
</html>
