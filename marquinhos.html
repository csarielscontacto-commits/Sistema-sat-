<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Marquinhos</title>

    <!-- Fuente cursiva para la placa -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        /* -------------------------------------------------
           VARIABLES DE COLOR (para cambiar rápidamente)
        ------------------------------------------------- */
        :root {
            --ceramica: #fdfdfd;               /* blanco brillante */
            --bordes:   #1a237e;               /* azul oscuro del contorno */
            --patron:   #1a237e;               /* azul cobalto del patrón */
            --rubor:    #ffcdd2;               /* rosa suave de las mejillas */
            --texto-placa: #0d1b5b;            /* azul oscuro del texto */
        }

        /* -------------------------------------------------
           ESTILO GLOBAL
        ------------------------------------------------- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;               /* fondo de estudio puro */
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .robot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* -------------------------------------------------
           CABEZA
        ------------------------------------------------- */
        .head {
            width: 160px;
            height: 140px;
            background: var(--ceramica);
            border: 4px solid var(--bordes);
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow:
                0 8px 12px rgba(0,0,0,.08),            /* sombra externa */
                inset 0 0 12px rgba(255,255,255,.6);   /* brillo interno */
            /* Patrón Talavera (SVG en data‑uri) */
            background-image: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
                <defs><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">\
                <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/></pattern></defs>\
                <rect width="200" height="200" fill="url(%23p)"/></svg>');
            background-size: 40px 40px;
        }

        /* Antenas */
        .antenna {
            width: 20px;
            height: 25px;
            background: var(--bordes);
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -18px;
            left: 25px;
        }
        .antenna.right { left: auto; right: 25px; }
        .antenna::after {
            content: '';
            width: 24px;
            height: 24px;
            background: var(--ceramica);
            border: 3px solid var(--bordes);
            border-radius: 50%;
            position: absolute;
            top: -20px;
            left: -5px;
        }

        /* Orejas */
        .ear {
            width: 30px;
            height: 30px;
            background: var(--bordes);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid var(--ceramica);
            left: -15px;
        }
        .ear.right { left: auto; right: -15px; }

        /* Ojos */
        .eye {
            width: 35px;
            height: 45px;
            background: #111;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            box-shadow: inset -5px -5px 10px #444;
        }
        .eye.left  { left: 25px; }
        .eye.right { right: 25px; }
        .eye::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 8px;
        }

        /* Sonrisa */
        .mouth {
            width: 30px;
            height: 15px;
            border-bottom: 4px solid var(--bordes);
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 25px;
            left: 65px;
        }

        /* Mejillas (rubor) */
        .cheek {
            width: 20px;
            height: 15px;
            background: var(--rubor);
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            filter: blur(4px);
        }
        .cheek.left  { left: 15px; }
        .cheek.right { right: 15px; }

        /* -------------------------------------------------
           CUERPO
        ------------------------------------------------- */
        .body {
            width: 140px;
            height: 160px;
            background: var(--ceramica);
            border: 4px solid var(--bordes);
            border-radius: 20px 20px 30px 30px;
            margin-top: -10px;
            position: relative;
            box-shadow:
                0 10px 20px rgba(0,0,0,.1),
                inset 0 0 12px rgba(255,255,255,.6);
            /* Patrón Talavera (repetir) */
            background-image: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
                <defs><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse">\
                <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/></pattern></defs>\
                <rect width="200" height="200" fill="url(%23p)"/></svg>');
            background-size: 40px 40px;
        }

        /* Brazos */
        .arm {
            width: 40px;
            height: 60px;
            background: var(--ceramica);
            border: 4px solid var(--bordes);
            border-radius: 20px 20px 30px 30px;
            position: absolute;
            top: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5px;
            box-shadow: inset 0 0 8px rgba(255,255,255,.5);
        }
        .arm.left  { left: -45px; }
        .arm.right { right: -45px; }

        .hand {
            width: 12px;
            height: 12px;
            background: var(--ceramica);
            border: 3px solid var(--bordes);
            border-radius: 50% 50% 0 0;
        }

        /* Placa del nombre */
        .plate {
            background: #e8eaf6;
            border: 2px dashed var(--bordes);
            border-radius: 10px;
            padding: 8px 15px;
            font-weight: bold;
            color: var(--texto-placa);
            font-size: 1.2rem;
            font-family: 'Great Vibes', cursive;
        }
        .plate-container { text-align: center; }

        /* Patas */
        .foot {
            width: 30px;
            height: 25px;
            background: var(--ceramica);
            border: 4px solid var(--bordes);
            border-radius: 15px 15px 0 0;
            position: absolute;
            bottom: -25px;
            box-shadow: inset 0 0 6px rgba(255,255,255,.5);
        }
        .foot.left  { left: 20px; }
        .foot.right { right: 20px; }
    </style>
</head>
<body>
    <div class="robot-container">
        <div class="head">
            <div class="antenna"></div><div class="antenna right"></div>
            <div class="ear"></div><div class="ear right"></div>
            <div class="eye left"></div><div class="eye right"></div>
            <div class="cheek left"></div><div class="cheek right"></div>
            <div class="mouth"></div>
        </div>

        <div class="body">
            <div class="arm left"><div class="hand"></div></div>
            <div class="arm right"><div class="hand"></div></div>

            <div class="plate-container">
                <div class="plate">Marquinhos</div>
            </div>

            <div class="foot left"></div>
            <div class="foot right"></div>
        </div>
    </div>
</body>
</html>
