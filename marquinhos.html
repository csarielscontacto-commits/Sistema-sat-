<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marquinhos Talavera</title>
  <style>
    :root {
      --bg: #07111f;
      --card: #0d1726;
      --border: #1a237e;
      --white: #fdfdfd;
      --blue: #1a237e;
      --pink: #ffccd2;
      --gold: #d9b45a;
      --shadow: rgba(0,0,0,.25);
      --speed: .28s;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #14304d, var(--bg) 60%);
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    .ecosystem-assistant {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 240px;
      transform-origin: center bottom;
      z-index: 9999;
      pointer-events: auto;
      filter: drop-shadow(0 18px 30px var(--shadow));
    }

    .assistant-card {
      background: linear-gradient(180deg, rgba(13,23,38,.96), rgba(8,13,22,.96));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 14px 14px 16px;
      backdrop-filter: blur(8px);
    }

    .head {
      position: relative;
      width: 150px;
      height: 132px;
      margin: 0 auto;
      background: var(--white);
      border: 4px solid var(--blue);
      border-radius: 50% 50% 42% 42%;
      overflow: hidden;
      box-shadow: inset 0 0 16px rgba(255,255,255,.55);
    }

    .head::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .28;
      background-image: radial-gradient(circle at 20px 20px, var(--blue) 0 2px, transparent 2.2px),
                        radial-gradient(circle at 40px 40px, var(--blue) 0 2px, transparent 2.2px);
      background-size: 48px 48px;
    }

    .antenna {
      position: absolute;
      top: -18px;
      width: 4px;
      height: 26px;
      background: var(--blue);
      border-radius: 999px;
      transform-origin: bottom;
      animation: sway 2.8s ease-in-out infinite alternate;
    }

    .antenna.left { left: 48px; }
    .antenna.right { right: 48px; animation-delay: .15s; }

    .antenna::after {
      content: "";
      position: absolute;
      top: -8px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(217,180,90,.8);
    }

    .eye {
      position: absolute;
      top: 36px;
      width: 34px;
      height: 42px;
      border-radius: 50%;
      background: #101010;
      overflow: hidden;
    }
    .eye.left { left: 24px; }
    .eye.right { right: 24px; }

    .eye::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 50%;
      transform: scaleY(.72);
    }

    .pupil {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #000;
      border-radius: 50%;
      top: 12px;
      left: 12px;
      z-index: 2;
      animation: look 4s linear infinite;
    }

    .mouth {
      position: absolute;
      left: 50%;
      bottom: 25px;
      width: 34px;
      height: 16px;
      border-bottom: 4px solid var(--blue);
      border-radius: 0 0 50% 50%;
      transform: translateX(-50%);
      transition: all var(--speed) ease;
    }

    .cheek {
      position: absolute;
      bottom: 30px;
      width: 18px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink);
      filter: blur(3px);
      opacity: .95;
    }
    .cheek.left { left: 14px; }
    .cheek.right { right: 14px; }

    .body {
      position: relative;
      width: 160px;
      height: 170px;
      margin: -8px auto 0;
      background: linear-gradient(180deg, var(--white), #eef3ff);
      border: 4px solid var(--blue);
      border-radius: 22px 22px 32px 32px;
      overflow: hidden;
      box-shadow: inset 0 0 16px rgba(255,255,255,.55);
      animation: breathe 3s ease-in-out infinite;
    }

    .body::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      background-image:
        linear-gradient(135deg, transparent 0 45%, rgba(26,35,126,.6) 45% 50%, transparent 50% 100%);
      background-size: 42px 42px;
    }

    .arm {
      position: absolute;
      top: 24px;
      width: 22px;
      height: 92px;
      background: var(--white);
      border: 3px solid var(--blue);
      border-radius: 12px;
      transform-origin: top center;
    }

    .arm.left { left: -10px; transform: rotate(-14deg); }
    .arm.right { right: -10px; transform: rotate(14deg); }

    .forearm {
      position: absolute;
      top: 74px;
      left: 1px;
      width: 18px;
      height: 76px;
      background: var(--white);
      border: 2px solid var(--blue);
      border-radius: 10px;
      transform-origin: top center;
    }

    .hand {
      position: absolute;
      top: 68px;
      left: -6px;
      width: 30px;
      height: 30px;
      background: var(--white);
      border: 2px solid var(--blue);
      border-radius: 50%;
      transform-origin: center;
    }

    .finger {
      position: absolute;
      top: 2px;
      width: 6px;
      height: 12px;
      background: var(--white);
      border: 1px solid var(--blue);
      border-radius: 4px;
    }
    .finger:nth-child(1) { left: 4px; }
    .finger:nth-child(2) { left: 12px; }
    .finger:nth-child(3) { left: 20px; }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,.8);
    }

    .name {
      margin-top: 4px;
      text-align: center;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .4px;
    }

    .assistant {
      animation: idle 4s ease-in-out infinite;
    }

    .assistant.happy .mouth {
      width: 42px;
      height: 22px;
      border-bottom-width: 5px;
    }

    .assistant.loving .mouth {
      width: 40px;
      height: 20px;
      border-bottom-width: 5px;
    }

    .assistant.sad .mouth {
      border-bottom: 0;
      border-top: 4px solid var(--blue);
      border-radius: 50% 50% 0 0;
      bottom: 22px;
    }

    .assistant.surprised .mouth {
      width: 22px;
      height: 24px;
      border: 4px solid var(--blue);
      border-radius: 50%;
    }

    .assistant.talking .mouth {
      animation: talk .18s ease-in-out infinite alternate;
    }

    .assistant.waving .arm.right {
      animation: waveRight .45s ease-in-out infinite alternate;
    }

    .assistant.waving .arm.left {
      animation: waveLeft .45s ease-in-out infinite alternate;
    }

    .assistant.waving .finger {
      animation: fingerMove .25s ease-in-out infinite alternate;
    }

    .assistant.wink .eye.left::before {
      transform: scaleY(.08);
    }

    .assistant.excited {
      animation: bounce .5s ease-in-out infinite alternate;
    }

    .assistant.thinking .pupil {
      animation: think 1.2s ease-in-out infinite alternate;
    }

    .assistant.calm .mouth {
      width: 30px;
    }

    @keyframes idle {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(2px) scale(1.01); }
    }

    @keyframes breathe {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    @keyframes blink {
      0%, 46%, 100% { transform: scaleY(1); }
      48% { transform: scaleY(.08); }
    }

    @keyframes look {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(7px); }
      50% { transform: translateX(0); }
      75% { transform: translateX(-7px); }
    }

    @keyframes talk {
      from { transform: translateX(-50%) scaleX(.9); height: 8px; }
      to { transform: translateX(-50%) scaleX(1.12); height: 22px; }
    }

    @keyframes waveRight {
      from { transform: rotate(12deg); }
      to { transform: rotate(60deg); }
    }

    @keyframes waveLeft {
      from { transform: rotate(-12deg); }
      to { transform: rotate(-60deg); }
    }

    @keyframes fingerMove {
      from { transform: rotate(-8deg); }
      to { transform: rotate(14deg); }
    }

    @keyframes think {
      from { transform: translate(0, -2px); }
      to { transform: translate(6px, -7px); }
    }

    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-8px) scale(1.03); }
    }

    @keyframes sway {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <div class="ecosystem-assistant">
    <div class="assistant-card assistant" id="assistant">
      <div class="head">
        <div class="antenna left"></div>
        <div class="antenna right"></div>
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="mouth"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>

      <div class="body">
        <div class="arm left">
          <div class="forearm">
            <div class="hand">
              <div class="finger"></div>
              <div class="finger"></div>
              <div class="finger"></div>
            </div>
          </div>
        </div>

        <div class="arm right">
          <div class="forearm">
            <div class="hand">
              <div class="finger"></div>
              <div class="finger"></div>
              <div class="finger"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="name">Marquinhos Talavera</div>
      <div class="status" id="status">Listo para saludar</div>
    </div>
  </div>

  <script>
    const assistant = document.getElementById('assistant');
    const statusEl = document.getElementById('status');

    const states = ['happy','loving','sad','surprised','talking','waving','wink','excited','thinking','calm'];

    function resetStates() {
      assistant.classList.remove(...states);
    }

    function setState(state, text, time = 3000) {
      resetStates();
      assistant.classList.add(state);
      if (text) statusEl.textContent = text;
      setTimeout(() => {
        resetStates();
        assistant.classList.add('calm');
        statusEl.textContent = 'Esperando interacción';
      }, time);
    }

    function reactToMessage(message) {
      const m = message.toLowerCase();

      if (m.includes('hola') || m.includes('buenos días') || m.includes('buenas')) {
        setState('waving', 'Saludando con amabilidad', 3500);
        speak('Hola, qué gusto verte.');
        return;
      }

      if (m.includes('gracias') || m.includes('genial') || m.includes('feliz')) {
        setState('happy', 'Emoción alegre', 3000);
        speak('Me alegra mucho.');
        return;
      }

      if (m.includes('te quiero') || m.includes('cariño') || m.includes('amor')) {
        setState('loving', 'Expresión cariñosa', 4000);
        speak('Yo también te acompaño con mucho cariño.');
        return;
      }

      if (m.includes('triste') || m.includes('mal') || m.includes('solo')) {
        setState('sad', 'Expresión empática', 4000);
        speak('Estoy contigo. Vamos paso a paso.');
        return;
      }

      if (m.includes('wow') || m.includes('sorpresa') || m.includes('increíble')) {
        setState('surprised', 'Sorpresa amable', 2500);
        speak('¡Vaya, qué interesante!');
        return;
      }

      if (m.includes('pensando') || m.includes('espera')) {
        setState('thinking', 'Procesando ideas', 3500);
        speak('Un momento, estoy pensando.');
        return;
      }

      setState('talking', 'Conversando');
      speak('Cuéntame más.');
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-MX';
      utter.rate = 1;
      utter.pitch = 1.1;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function greetUser() {
      setState('waving', 'Hola, bienvenida o bienvenido', 3200);
      speak('Hola, soy Marquinhos Talavera.');
    }

    greetUser();

    window.MarquinhosTalavera = {
      reactToMessage,
      setState,
      speak
    };
  </script>
</body>
</html>
