<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Marquinhos - Edición Cerámica</title>

    <!-- Fuente cursiva para la placa -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        :root {
            --ceramica-light: #ffffff;
            --ceramica-mid: #f0f4f8;
            --bordes: #1a237e;
            --patron-color: #1a237e;
            --rubor: #ffcdd2;
            --texto-placa: #0d1b5b;
            --sombra-suave: rgba(0, 0, 0, 0.1);
            --brillo-punto: rgba(255, 255, 255, 0.8);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .robot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
        }

        /* --- CABEZA --- */
        .head {
            width: 160px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, var(--ceramica-light), var(--ceramica-mid));
            border: 4px solid var(--bordes);
            border-radius: 50% 50% 40% 40%;
            position: relative;
            z-index: 2;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05);
            
            /* Patrón Talavera estilizado */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="1" opacity="0.4"/></svg>');
            background-size: 40px 40px;
        }

        .antenna {
            width: 15px;
            height: 25px;
            background: var(--bordes);
            position: absolute;
            top: -20px;
            border-radius: 5px;
        }
        .antenna.left { left: 35px; }
        .antenna.right { right: 35px; }
        
        .antenna::after {
            content: '';
            width: 22px;
            height: 22px;
            background: var(--ceramica-light);
            border: 3px solid var(--bordes);
            border-radius: 50%;
            position: absolute;
            top: -18px;
            left: -6px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .ear {
            width: 30px;
            height: 30px;
            background: var(--bordes);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: 3px solid var(--ceramica-light);
        }
        .ear.left { left: -15px; }
        .ear.right { right: -15px; }

        .eye {
            width: 30px;
            height: 40px;
            background: #111;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }
        .eye::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            left: 6px;
        }

        .cheek {
            width: 25px;
            height: 15px;
            background: var(--rubor);
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            filter: blur(5px);
            opacity: 0.6;
        }
        .cheek.left { left: 20px; }
        .cheek.right { right: 20px; }

        .mouth {
            width: 30px;
            height: 15px;
            border-bottom: 4px solid var(--bordes);
            border-radius: 0 0 50% 50%;
            position: absolute;
            bottom: 25px;
            left: 65px;
        }

        /* --- CUERPO --- */
        .body {
            width: 150px;
            height: 170px;
            background: radial-gradient(circle at 30% 30%, var(--ceramica-light), var(--ceramica-mid));
            border: 4px solid var(--bordes);
            border-radius: 30px 30px 40px 40px;
            margin-top: -15px;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="1" opacity="0.4"/></svg>');
            background-size: 40px 40px;
            box-shadow: inset -8px -8px 20px rgba(0,0,0,0.05);
        }

        .arm {
            width: 35px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, var(--ceramica-light), var(--ceramica-mid));
            border: 4px solid var(--bordes);
            border-radius: 20px, 20px 20px 15px 15px;
            position: absolute;
            top: 30px;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
        }
        .arm.left { left: -40px; transform: rotate(5deg); }
        .arm.right { right: -40px; transform: rotate(-5deg); }

        .hand {
            width: 15px;
            height: 15px;
            background: var(--ceramica-light);
            border: 4px solid var(--bordes);
            border-radius: 50%;
        }

        /* --- PLACA --- */
        .plate-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .plate {
            background: linear-gradient(135deg, #ffffff, #e0e0ff);
            border: 2px solid var(--bordes);
            border-radius: 50px;
            padding: 5px 20px;
            color: var(--texto-placa);
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), inset 0 0 5px rgba(255,255,255,0.8);
            white-space: nowrap;
        }

        /* --- PIES --- */
        .foot {
            width: 45px;
            height: 30px;
            background: var(--ceramica-mid);
            border: 4px solid var(--bordes);
            border-radius: 15px 15px 10px 10px;
            position: absolute;
            bottom: -30px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        .foot.left { left: 20px; }
        .foot.right { right: 20px; }

        /* Sombra en el suelo */
        .ground-shadow {
            width: 160px;
            height: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            position: absolute;
            bottom: -45px;
            filter: blur(8px);
            z-index: -2;
        }
    </style>
</head>
<body>
    <div class="robot-container">
        <div class="head">
            <div class="antenna"></div>
            <div class="antenna right"></div>
            <div class="ear"></div>
            <div class="ear right"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="cheek left"></div>
            <div class="cheek right"></div>
            <div class="mouth"></div>
        </div>

        <div class="body">
            <div class="arm left"><div class="hand"></div></div>
            <div class="arm right"><div class="hand"></div></div>
            
            <div class="plate-container">
                <div class="plate">Marquinhos</div>
            </div>

            <div class="foot left"></div>
            <div class="foot right"></div>
            <div class="ground-shadow"></div>
        </div>
    </div>
</body>
</html>
