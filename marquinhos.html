<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquinhos – Robot Talavera</title>

  <!-- Fuente cursiva para la placa -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------
       VARIABLES DE COLOR (para cambiar rápidamente)
       ------------------------------------------------- */
    :root {
      --ceramica: #fdfdfd;               /* blanco brillante */
      --bordes: #1a237e;                /* azul cobalto (contorno) */
      --rubor: #ffccd2;                 /* mejillas rosadas */
      --texto-placa: #0d1b5b;           /* texto de la placa */
    }

    /* -------------------------------------------------
       ESTILO GLOBAL
       ------------------------------------------------- */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #e0f2fe;            /* fondo suave tipo estudio */
      margin: 0;
      font-family: system-ui, sans-serif;
      perspective: 800px;              /* 3D perspective */
    }

    .robot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateY(-12deg);
    }

    /* -------------------------------------------------
       TEXTURA DE CERÁMICA (ruido sutil)
       ------------------------------------------------- */
    .ceramica-texture {
      background-image:
        url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIiIGhlaWdodD0iMTIiIHZpZXdCb3g9IjAgMCAxMiAxMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjEyIiBoZWlnaHQ9IjEyIiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPHJlY3Qgd2lkdGg9IjEyIiBoZWlnaHQ9IjEyIiBmaWxsPSIjZTVlNSIgc3R5bGU9Im9wYWNpdHk6MC4wMiI+PC9yZWN0Pgo8L3N2Zz4=');
      background-size: cover;
    }

    /* -------------------------------------------------
       CABEZA
       ------------------------------------------------- */
    .head {
      width: 160px;
      height: 140px;
      background: var(--ceramica);
      border: 4px solid var(--bordes);
      border-radius: 50% 50% 40% 40%;
      position: relative;
      box-shadow: 0 12px 20px rgba(0,0,0,.15), inset 0 0 12px rgba(255,255,255,.6);
      overflow: hidden;
    }

    /* Patrón floral Talavera – SVG inline */
    .head::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
  <defs>\
    <pattern id="talavera" width="40" height="40" patternUnits="userSpaceOnUse">\
      <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/>\
    </pattern>\
  </defs>\
  <rect width="200" height="200" fill="url(%23talavera)"/>\
</svg>');
      background-size: 40px 40px;
      opacity: .4;
    }

    /* Brillo superior */
    .head::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30%;
      background: linear-gradient(to bottom, rgba(255,255,255,.6), transparent);
      border-radius: 50% 50% 0 0;
    }

    /* Antenas */
    .antenna {
      width: 20px;
      height: 25px;
      background: var(--bordes);
      border-radius: 50% 50% 0 0;
      position: absolute;
      top: -18px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
    }
    .antenna.left { left: 25px; }
    .antenna.right { right: 25px; }

    .antenna::after {
      content: "";
      width: 24px;
      height: 24px;
      background: var(--ceramica);
      border: 3px solid var(--bordes);
      border-radius: 50%;
      position: absolute;
      top: -20px;
      left: -5px;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    /* Orejas */
    .ear {
      width: 30px;
      height: 30px;
      background: var(--bordes);
      border-radius: 50%;
      border: 2px solid var(--ceramica);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
    }
    .ear.left { left: -15px; }
    .ear.right { right: -15px; }

    /* Ojos */
    .eye {
      width: 35px;
      height: 45px;
      background: #111;
      border-radius: 50%;
      position: absolute;
      top: 35px;
      box-shadow: inset -5px -5px 10px #444;
    }
    .eye.left  { left: 25px; }
    .eye.right { right: 25px; }

    .eye::after {
      content: "";
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 8px;
      left: 8px;
      box-shadow: 0 0 4px rgba(255,255,255,.8);
    }

    /* Boca / sonrisa */
    .mouth {
      width: 30px;
      height: 15px;
      border-bottom: 4px solid var(--bordes);
      border-radius: 0 0 50% 50%;
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Mejillas (rubor) */
    .cheek {
      width: 20px;
      height: 15px;
      background: var(--rubor);
      border-radius: 50%;
      position: absolute;
      bottom: 30px;
      filter: blur(3px);
    }
    .cheek.left  { left: 15px; }
    .cheek.right { right: 15px; }

    /* -------------------------------------------------
       CUERPO
       ------------------------------------------------- */
    .body {
      width: 140px;
      height: 160px;
      background: var(--ceramica);
      border: 4px solid var(--bordes);
      border-radius: 20px 20px 30px 30px;
      margin-top: -10px;
      position: relative;
      box-shadow: 0 15px 25px rgba(0,0,0,.12), inset 0 0 12px rgba(255,255,255,.6);
      overflow: hidden;
    }

    .body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">\
  <defs>\
    <pattern id="talavera2" width="40" height="40" patternUnits="userSpaceOnUse">\
      <path d="M0 20 Q10 0 20 20 T40 20" fill="none" stroke="%231a237e" stroke-width="2"/>\
    </pattern>\
  </defs>\
  <rect width="200" height="200" fill="url(%23talavera2)"/>\
</svg>');
      background-size: 40px 40px;
      opacity: .4;
    }

    /* Brillo lateral */
    .body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 30%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,.4), transparent);
      border-radius: 20px 0 0 30px;
    }

    /* Brazos */
    .arm {
      width: 40px;
      height: 60px;
      background: var(--ceramica);
      border: 4px solid var(--bordes);
      border-radius: 20px 20px 30px 30px;
      position: absolute;
      top: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 5px;
      box-shadow: inset 0 0 8px rgba(255,255,255,.5);
      transform-origin: top;
    }
    .arm.left  { left: -45px; transform: rotateZ(5deg); }
    .arm.right { right: -45px; transform: rotateZ(-5deg); }

    .hand {
      width: 12px;
      height: 12px;
      background: var(--ceramica);
      border: 3px solid var(--bordes);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 2px 4px rgba(0,0,0,.1);
    }

    /* Placa del nombre */
    .plate {
      background: #e8eaf6;
      border: 2px dashed var(--bordes);
      border-radius: 10px;
      padding: 8px 15px;
      font-weight: bold;
      color: var(--texto-placa);
      font-size: 1.2rem;
      font-family: 'Great Vibes', cursive;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
    }
    .plate-container { margin-top: 12px; text-align: center; }

    /* Piernas */
    .leg {
      width: 30px;
      height: 60px;
      background: var(--ceramica);
      border: 4px solid var(--bordes);
      border-radius: 10px 10px 30px 30px;
      position: absolute;
      bottom: -60px;
      box-shadow: inset 0 0 8px rgba(255,255,255,.5);
    }
    .leg.left  { left: 20px; }
    .leg.right { right: 20px; }

    .foot {
      width: 22px;
      height: 10px;
      background: var(--bordes);
      border-radius: 0 0 6px 6px;
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* -------------------------------------------------
       ANIMACIONES (ejemplo de parpadeo)
       ------------------------------------------------- */
    @keyframes blink {
      0%, 80%, 100% { transform: scaleY(1); }
      90% { transform: scaleY(0.1); }
    }

    .eye {
      animation: blink 5s infinite;
    }
  </style>
</head>
<body>

<div class="robot-container">

  <!-- ---------- CABEZA ---------- -->
  <div class="head ceramica-texture">
    <div class="antenna left"></div>
    <div class="antenna right"></div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="mouth"></div>

    <div class="cheek left"></div>
    <div class="cheek right"></div>
  </div>

  <!-- ---------- CUERPO ---------- -->
  <div class="body ceramica-texture">
    <div class="arm left">
      <div class="hand"></div>
    </div>
    <div class="arm right">
      <div class="hand"></div>
    </div>

    <div class="leg left">
      <div class="foot"></div>
    </div>
    <div class="leg right">
      <div class="foot"></div>
    </div>
  </div>

  <!-- ---------- PLACA ---------- -->
  <div class="plate-container">
    <div class="plate">Marquinhos</div>
  </div>
</div>

</body>
</html>
