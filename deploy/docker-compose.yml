version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sat_user
      POSTGRES_PASSWORD: sat_pass
      POSTGRES_DB: sat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ingest-sat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    ports:
      - "8080:8080"
    environment:
      SAT_ENDPOINT: "https://cfdi.sat.gob.mx/ws/soap"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "incoming_cfdis"
      WORKER_COUNT: "10"
    depends_on:
      - kafka
      - postgres
      - redis

  rules-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rules
    environment:
      KAFKA_BROKER: "kafka:9092"
      IN_TOPIC: "incoming_cfdis"
      OUT_TOPIC: "validated_cfdis"
    depends_on:
      - kafka

volumes:
  postgres_data: